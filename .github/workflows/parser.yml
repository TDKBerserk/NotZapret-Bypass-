name: NotZapret Parser

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Run collector
        run: python collector.py
      - name: Commit results
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add whitelist.txt blacklist.txt whitelist_base64.txt blacklist_base64.txt all_configs.txt summary.json
          git commit -m "Auto-update: $(date -u '+%Y-%m-%d %H:%M:%S')" || exit 0
          git push
